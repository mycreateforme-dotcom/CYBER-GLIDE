<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBER-GLIDE // Hyper-Tunnel Rush</title>

  <!-- Three.js 3D Engine -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- MediaPipe Hands & Camera API -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

  <style>
    :root {
      --bg: #020617;
      --cyan: #00f0ff;
      --pink: #ff0055;
      --amber: #f59e0b;
      --green: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Courier New', Courier, monospace;
    }
    body {
      background: radial-gradient(circle at center, #0f172a 0%, var(--bg) 100%);
      color: #e2e8f0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
      overflow-x: hidden;
      user-select: none;
    }
    header {
      text-align: center;
      margin-bottom: 6px;
    }
    .title {
      font-size: 2.2rem;
      font-weight: 900;
      letter-spacing: 4px;
      color: var(--cyan);
      text-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
    }
    .status-hud {
      display: flex;
      gap: 18px;
      margin-bottom: 8px;
      background: rgba(15, 23, 42, 0.85);
      padding: 6px 24px;
      border-radius: 6px;
      border: 1px solid rgba(0, 240, 255, 0.25);
      font-size: 0.95rem;
    }
    .viewport-container {
      position: relative;
      width: 940px;
      height: 590px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 40px rgba(0, 240, 255, 0.4);
      background: #000;
    }
    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .pip-cam {
      position: absolute;
      top: 12px;
      right: 12px;
      width: 160px;
      height: 120px;
      border-radius: 6px;
      overflow: hidden;
      border: 2px solid var(--cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
      background: #000;
      z-index: 10;
    }
    .pip-cam video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }
    .telemetry-tag {
      position: absolute;
      top: 12px;
      left: 12px;
      background: rgba(0, 0, 0, 0.85);
      border-left: 3px solid var(--cyan);
      padding: 6px 14px;
      font-size: 0.8rem;
      color: var(--cyan);
      z-index: 10;
    }
    .speedometer {
      position: absolute;
      bottom: 14px;
      right: 14px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid var(--cyan);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--green);
      z-index: 10;
    }
    .instructions {
      position: absolute;
      bottom: 14px;
      left: 14px;
      font-size: 0.8rem;
      font-weight: bold;
      color: var(--amber);
      background: rgba(0, 0, 0, 0.8);
      padding: 6px 12px;
      border-radius: 4px;
      z-index: 10;
    }
    .game-over-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(3, 7, 18, 0.94);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 30;
    }
    .btn-restart {
      background: linear-gradient(135deg, var(--cyan) 0%, #0077ff 100%);
      color: #000;
      border: none;
      padding: 12px 34px;
      font-size: 1.1rem;
      font-weight: 900;
      letter-spacing: 2px;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 16px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
    }
  </style>
</head>
<body>

  <header>
    <div class="title">CYBER-GLIDE</div>
  </header>

  <div class="status-hud">
    <div>DISTANCE: <span id="dist-val" style="color: var(--cyan);">0 M</span></div>
    <div>MULTIPLIER: <span id="mult-val" style="color: var(--amber);">1.0x</span></div>
    <div>RINGS HIT: <span id="rings-val" style="color: var(--green);">0</span></div>
    <div>THRUST: <span id="mode-val" style="color: var(--cyan);">CRUISE</span></div>
  </div>

  <div class="viewport-container" id="container">
    <div id="three-canvas"></div>

    <div class="pip-cam">
      <video id="webcam" autoplay playsinline></video>
    </div>

    <div class="telemetry-tag" id="telemetry">WARP DRIVE: STAND BY</div>
    <div class="instructions">TILT PALM = BANK & STEER // CLENCH FIST = BOOST // SPREAD HANDS = BRAKE</div>
    <div class="speedometer" id="speed-meter">SPEED: 260 KM/H</div>

    <div class="game-over-overlay" id="game-over-modal">
      <h2 style="font-size: 2.6rem; color: var(--pink); letter-spacing: 4px; margin-bottom: 8px;">HULL CRUSHED</h2>
      <p style="font-size: 1.1rem; color: #94a3b8; margin-bottom: 12px;">FINAL DISTANCE: <span id="final-dist" style="color: #fff;">0</span> M</p>
      <button class="btn-restart" onclick="restartGame()">RELAUNCH JET</button>
    </div>
  </div>

  <script>
    // Audio Synthesizer Engine
    const AudioEngine = {
      ctx: null,
      init() {
        if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)();
      },
      tone(f, type = 'sine', d = 0.08, vol = 0.15) {
        if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(f, this.ctx.currentTime);
        gain.gain.setValueAtTime(vol, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + d);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + d);
      },
      ringPass() {
        [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => this.tone(f, 'sine', 0.1, 0.2), i * 35));
      },
      boostRoar() {
        this.tone(140, 'sawtooth', 0.25, 0.25);
        setTimeout(() => this.tone(280, 'sine', 0.3, 0.18), 40);
      },
      crash() {
        this.tone(90, 'sawtooth', 0.4, 0.5);
        setTimeout(() => this.tone(40, 'triangle', 0.6, 0.6), 50);
      },
      pulseBeat() {
        this.tone(55, 'sine', 0.12, 0.2);
      }
    };

    // State Variables
    let distance = 0;
    let multiplier = 1.0;
    let ringsHit = 0;
    let baseSpeed = 0.50;  // Lowered default speed
    let speed = 0.50;
    let isGameOver = false;
    let beatTimer = 0;

    const distVal = document.getElementById('dist-val');
    const multVal = document.getElementById('mult-val');
    const ringsVal = document.getElementById('rings-val');
    const modeVal = document.getElementById('mode-val');
    const speedMeter = document.getElementById('speed-meter');
    const telemetry = document.getElementById('telemetry');
    const gameOverModal = document.getElementById('game-over-modal');
    const finalDist = document.getElementById('final-dist');
    const container = document.getElementById('container');

    // 1. Three.js Infinite 3D Tunnel Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020617);
    scene.fog = new THREE.FogExp2(0x020617, 0.018);

    const camera = new THREE.PerspectiveCamera(65, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 0, 3.5);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.getElementById('three-canvas').appendChild(renderer.domElement);

    // Multi-Point Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
    scene.add(ambientLight);

    const tunnelLight = new THREE.PointLight(0x00f0ff, 2.5, 40);
    tunnelLight.position.set(0, 0, 0);
    scene.add(tunnelLight);

    // 2. High-Speed Sci-Fi Jet Glider
    function buildJetMesh() {
      const root = new THREE.Group();

      const titaniumMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.9, roughness: 0.15 });
      const cyanGlow = new THREE.MeshStandardMaterial({ color: 0x00f0ff, emissive: 0x00f0ff, emissiveIntensity: 1.2 });
      const pinkGlow = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 1.5 });

      // Fuselage
      const nose = new THREE.Mesh(new THREE.ConeGeometry(0.3, 1.8, 4), titaniumMat);
      nose.rotation.x = -Math.PI / 2;
      nose.position.z = -0.4;
      root.add(nose);

      // Wings
      const wingGeo = new THREE.BoxGeometry(2.4, 0.04, 0.6);
      const wings = new THREE.Mesh(wingGeo, titaniumMat);
      wings.position.set(0, -0.05, 0.2);
      root.add(wings);

      // Neon Plasma Strips
      [-1.15, 1.15].forEach(x => {
        const strip = new THREE.Mesh(new THREE.BoxGeometry(0.06, 0.08, 0.8), cyanGlow);
        strip.position.set(x, -0.04, 0.2);
        root.add(strip);
      });

      // Engines
      const engines = [];
      [-0.22, 0.22].forEach(x => {
        const eng = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.12, 0.4, 12), titaniumMat);
        eng.rotation.x = Math.PI / 2;
        eng.position.set(x, 0, 0.6);
        root.add(eng);

        const flame = new THREE.Mesh(new THREE.ConeGeometry(0.08, 0.5, 8), pinkGlow);
        flame.rotation.x = Math.PI / 2;
        flame.position.set(x, 0, 0.9);
        root.add(flame);
        engines.push(flame);
      });

      root.position.set(0, -0.6, 1.2);
      scene.add(root);
      return { root, engines };
    }

    const jet = buildJetMesh();

    // 3. Infinite Warp Tunnel Ring Geometry
    const tunnelRings = [];
    const TUNNEL_RADIUS = 3.6;
    const RING_COUNT = 35;

    for (let i = 0; i < RING_COUNT; i++) {
      const ringGeo = new THREE.TorusGeometry(TUNNEL_RADIUS, 0.04, 8, 32);
      const ringMat = new THREE.MeshBasicMaterial({
        color: i % 2 === 0 ? 0x00f0ff : 0x1e293b,
        transparent: true,
        opacity: 0.65
      });
      const ringMesh = new THREE.Mesh(ringGeo, ringMat);
      ringMesh.position.z = -i * 3.5;
      scene.add(ringMesh);
      tunnelRings.push(ringMesh);
    }

    // 4. Tunnel Obstacles, Lasers & Boost Gates
    let hazards = [];
    let speedGates = [];
    let particles = [];

    const hazardMat = new THREE.MeshStandardMaterial({ color: 0xff0055, emissive: 0xff0055, emissiveIntensity: 0.8, roughness: 0.2 });
    const gateMat = new THREE.MeshBasicMaterial({ color: 0x00ff66, wireframe: true });

    function spawnHazard(zPos) {
      const type = Math.random();
      const hazardGroup = new THREE.Group();

      if (type < 0.4) {
        const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, TUNNEL_RADIUS * 1.8, 8), hazardMat);
        hazardGroup.add(beam);
        hazardGroup.rotSpeed = (Math.random() > 0.5 ? 1 : -1) * 0.03;
      } else if (type < 0.75) {
        const block = new THREE.Mesh(new THREE.BoxGeometry(2.2, 1.4, 0.4), hazardMat);
        const angle = Math.random() * Math.PI * 2;
        block.position.set(Math.cos(angle) * (TUNNEL_RADIUS - 1.2), Math.sin(angle) * (TUNNEL_RADIUS - 1.2), 0);
        hazardGroup.add(block);
        hazardGroup.rotSpeed = 0;
      } else {
        const b1 = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, TUNNEL_RADIUS * 1.8, 8), hazardMat);
        const b2 = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, TUNNEL_RADIUS * 1.8, 8), hazardMat);
        b2.rotation.z = Math.PI / 2;
        hazardGroup.add(b1);
        hazardGroup.add(b2);
        hazardGroup.rotSpeed = 0.02;
      }

      hazardGroup.position.set(0, 0, zPos);
      scene.add(hazardGroup);
      hazards.push(hazardGroup);
    }

    function spawnSpeedGate(zPos) {
      const gate = new THREE.Mesh(new THREE.TorusGeometry(1.6, 0.08, 12, 24), gateMat);
      const angle = Math.random() * Math.PI * 2;
      gate.position.set(Math.cos(angle) * 1.4, Math.sin(angle) * 1.4, zPos);
      scene.add(gate);
      speedGates.push(gate);
    }

    // Initial Hazard Population
    for (let i = 8; i < RING_COUNT; i += 3) {
      if (Math.random() > 0.3) spawnHazard(-i * 3.5);
      else spawnSpeedGate(-i * 3.5);
    }

    function spawnExplosion(pos, colorHex = 0xff0055, count = 30) {
      for (let i = 0; i < count; i++) {
        const pMesh = new THREE.Mesh(
          new THREE.BoxGeometry(0.14, 0.14, 0.14),
          new THREE.MeshBasicMaterial({ color: colorHex })
        );
        pMesh.position.copy(pos);
        const vel = new THREE.Vector3(
          (Math.random() - 0.5) * 14,
          (Math.random() - 0.5) * 14,
          (Math.random() - 0.5) * 14
        );
        particles.push({ mesh: pMesh, vel, life: 1.0 });
        scene.add(pMesh);
      }
    }

    // 5. MediaPipe Hand Landmark Aerodynamic Controls
    const flightControl = {
      targetX: 0,
      targetY: 0,
      currentX: 0,
      currentY: 0,
      bankAngle: 0,
      isBoost: false,
      isBrake: false
    };

    function dist(p1, p2) {
      return Math.hypot(p1.x - p2.x, p1.y - p2.y);
    }

    function isFist(landmarks) {
      const wrist = landmarks[0];
      const isCurled = (tip, mcp) => dist(landmarks[tip], wrist) < dist(landmarks[mcp], wrist) * 1.15;
      return isCurled(8, 5) && isCurled(12, 9) && isCurled(16, 13) && isCurled(20, 17);
    }

    function onResults(results) {
      if (isGameOver) return;

      if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
        const lms = results.multiHandLandmarks[0];

        const rawX = (1 - lms[0].x - 0.5) * 4.8;
        const rawY = -(lms[0].y - 0.5) * 4.0;

        flightControl.targetX = Math.max(-2.4, Math.min(2.4, rawX));
        flightControl.targetY = Math.max(-2.4, Math.min(2.4, rawY));

        const dx = -(lms[8].x - lms[0].x);
        const dy = -(lms[8].y - lms[0].y);
        flightControl.bankAngle = Math.atan2(dy, dx) - Math.PI / 2;

        const fist = isFist(lms);
        flightControl.isBoost = fist;

        flightControl.isBrake = results.multiHandLandmarks.length >= 2;

        if (flightControl.isBoost) {
          modeVal.innerText = "BOOST (ACCEL)";
          modeVal.style.color = "var(--pink)";
          telemetry.innerText = "THRUSTERS ENGAGED // BOOST VELOCITY";
        } else if (flightControl.isBrake) {
          modeVal.innerText = "AIR BRAKES DEPLOYED";
          modeVal.style.color = "var(--amber)";
          telemetry.innerText = "BRAKES ENGAGED // SLOW PRECISION";
        } else {
          modeVal.innerText = "AERODYNAMIC GLIDE";
          modeVal.style.color = "var(--cyan)";
          telemetry.innerText = "NEURAL LINK: FLIGHT STABLE";
        }
      } else {
        flightControl.isBoost = false;
        flightControl.isBrake = false;
        telemetry.innerText = "NO HAND DETECTED // EXTEND PALM TO STEER";
      }
    }

    const hands = new Hands({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
    });
    hands.setOptions({
      maxNumHands: 2,
      modelComplexity: 0,
      minDetectionConfidence: 0.65,
      minTrackingConfidence: 0.65
    });
    hands.onResults(onResults);

    const cameraFeed = new Camera(document.getElementById('webcam'), {
      onFrame: async () => { await hands.send({ image: document.getElementById('webcam') }); },
      width: 640,
      height: 480
    });
    cameraFeed.start();

    // 6. Game Loop & Tunnel Physics
    function updateGame() {
      if (isGameOver) return;

      // Adjusted Calibrated Speeds
      if (flightControl.isBoost) {
        speed = 0.95; // Manageable boost
        AudioEngine.boostRoar();
        jet.engines.forEach(e => e.scale.set(1.3, 1.8, 1.3));
      } else if (flightControl.isBrake) {
        speed = 0.30; // Controlled brake
        jet.engines.forEach(e => e.scale.set(0.7, 0.5, 0.7));
      } else {
        speed = baseSpeed + (distance / 8000) * 0.15; // Slow, gradual distance scaling
        jet.engines.forEach(e => e.scale.set(1.0, 1.0, 1.0));
      }

      distance += Math.round(speed * 6);
      distVal.innerText = `${distance} M`;
      speedMeter.innerText = `SPEED: ${Math.round(speed * 520)} KM/H`;

      beatTimer++;
      if (beatTimer % (flightControl.isBoost ? 25 : 50) === 0) {
        AudioEngine.pulseBeat();
      }

      // Smooth Jet Steering
      const prevX = flightControl.currentX;
      flightControl.currentX += (flightControl.targetX - flightControl.currentX) * 0.16;
      flightControl.currentY += (flightControl.targetY - flightControl.currentY) * 0.16;

      jet.root.position.set(flightControl.currentX, flightControl.currentY, 1.2);

      camera.position.x += (flightControl.currentX * 0.35 - camera.position.x) * 0.1;
      camera.position.y += (flightControl.currentY * 0.35 - camera.position.y) * 0.1;

      const deltaX = flightControl.currentX - prevX;
      jet.root.rotation.z = -deltaX * 1.6 + flightControl.bankAngle * 0.35;
      jet.root.rotation.x = -(flightControl.targetY - jet.root.position.y) * 0.12;

      camera.rotation.z = -deltaX * 0.4;

      // Scroll Tunnel Rings
      tunnelRings.forEach(r => {
        r.position.z += speed;
        if (r.position.z > 4.0) {
          r.position.z -= RING_COUNT * 3.5;
        }
      });

      // Update Hazards
      for (let i = hazards.length - 1; i >= 0; i--) {
        const h = hazards[i];
        h.position.z += speed;
        if (h.rotSpeed) h.rotation.z += h.rotSpeed;

        if (Math.abs(h.position.z - jet.root.position.z) < 0.55) {
          const jetPos = new THREE.Vector2(jet.root.position.x, jet.root.position.y);

          h.children.forEach(mesh => {
            const meshPos = new THREE.Vector3();
            mesh.getWorldPosition(meshPos);

            if (jetPos.distanceTo(new THREE.Vector2(meshPos.x, meshPos.y)) < 1.0) {
              AudioEngine.crash();
              spawnExplosion(jet.root.position, 0xff0055, 45);
              isGameOver = true;
              gameOverModal.style.display = 'flex';
              finalDist.innerText = distance;
            }
          });
        }

        if (h.position.z > 6) {
          scene.remove(h);
          hazards.splice(i, 1);
          spawnHazard(-RING_COUNT * 3.2 - Math.random() * 15);
        }
      }

      // Update Speed Gates
      for (let i = speedGates.length - 1; i >= 0; i--) {
        const gate = speedGates[i];
        gate.position.z += speed;
        gate.rotation.z += 0.02;

        if (Math.abs(gate.position.z - jet.root.position.z) < 0.55) {
          if (new THREE.Vector2(jet.root.position.x, jet.root.position.y).distanceTo(new THREE.Vector2(gate.position.x, gate.position.y)) < 1.4) {
            AudioEngine.ringPass();
            ringsHit++;
            multiplier += 0.2;
            ringsVal.innerText = ringsHit;
            multVal.innerText = `${multiplier.toFixed(1)}x`;

            spawnExplosion(gate.position, 0x00ff66, 20);
            scene.remove(gate);
            speedGates.splice(i, 1);
            continue;
          }
        }

        if (gate.position.z > 6) {
          scene.remove(gate);
          speedGates.splice(i, 1);
          spawnSpeedGate(-RING_COUNT * 3.2 - Math.random() * 15);
        }
      }

      // Update Particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.mesh.position.addScaledVector(p.vel, 0.03);
        p.life -= 0.03;
        p.mesh.scale.setScalar(p.life);
        if (p.life <= 0) {
          scene.remove(p.mesh);
          particles.splice(i, 1);
        }
      }
    }

    function restartGame() {
      isGameOver = false;
      distance = 0;
      multiplier = 1.0;
      ringsHit = 0;
      speed = baseSpeed;
      distVal.innerText = '0 M';
      multVal.innerText = '1.0x';
      ringsVal.innerText = '0';

      hazards.forEach(h => scene.remove(h));
      speedGates.forEach(g => scene.remove(g));
      particles.forEach(p => scene.remove(p.mesh));

      hazards = [];
      speedGates = [];
      particles = [];

      for (let i = 8; i < RING_COUNT; i += 3) {
        if (Math.random() > 0.3) spawnHazard(-i * 3.5);
        else spawnSpeedGate(-i * 3.5);
      }

      gameOverModal.style.display = 'none';
    }

    function animate() {
      requestAnimationFrame(animate);
      updateGame();
      renderer.render(scene, camera);
    }

    window.addEventListener('click', () => AudioEngine.init(), { once: true });
    animate();
  </script>
</body>
</html>
